<!doctype html>
<meta charset="utf-8">
<title>Static dashboard</title>
<style>
  body { font: 16px system-ui; margin: 3rem; color: #222; }
  .card { display: inline-block; padding: 1.2rem 2rem; margin: .5rem; border-radius: 12px; background: #f1f3f6; }
  b { font-size: 2rem; display: block; }
</style>
<h1>Static dashboard</h1>
<p>Served by the app itself. Quit the app and the server goes with it.</p>
<div class="card"><b id="n">0</b>clicks</div>
<button onclick="n.textContent = +n.textContent + 1">+1</button>
<a href="https://example.com" target="_blank">external link (opens in the browser)</a>
